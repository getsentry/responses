minVersion: "3.9.0"
github:
  owner: getsentry
  repo: responses
changelog: CHANGES
preReleaseCommand: bash scripts/bump-version.sh
versioning:
  policy: manual
targets:
  - name: pypi
  - name: github
  - name: sentry-pypi
    internalPypiRepo: getsentry/pypi
requireNames:
  - /^responses-.+-py3-none-any.whl$/
  - /^responses-.+.tar.gz$/
